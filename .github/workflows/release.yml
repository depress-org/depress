name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing to npm'
        required: true
        default: ""

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit confirmation for manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'publish'
        run: |
          echo "Manual dispatch requires input 'confirm' set to the literal word 'publish'." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build all packages
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

      - name: Fail closed on unresolved release risks (owner and expiry are not waivers)
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('docs/security/pr26/release-risks.json','utf8')); if(r.schemaVersion!==1 || !Array.isArray(r.risks) || r.risks.some(x=>x.status!=='closed')) { console.error('NO-GO',r.risks); process.exit(1); }"

      - name: Independently audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Cold generated compatibility (not a default-theme quality waiver)
        run: node scripts/cold-consumer.mjs && node scripts/default-consumer.mjs

  publish:
    name: Publish to npm
    needs: build-and-test
    runs-on: ubuntu-latest
    # Manual approval gate: this environment must have required reviewers
    # configured in repo Settings -> Environments -> npm-publish.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build all packages
        run: npm run build

      - name: Publish @depress-org/core
        run: npm publish --workspace packages/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @depress-org/wp-migrate
        run: npm publish --workspace packages/wp-migrate --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish depress CLI (@depress-org/depress)
        run: npm publish --workspace packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
