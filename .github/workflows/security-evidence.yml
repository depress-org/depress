name: Security evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-evidence:
    name: Audit inventory and targeted regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --test scripts/security-audit.test.mjs
      # This is snapshot integrity/patch verification, NOT a clean audit gate.
      # Public hosting and generated-site releases remain NO-GO per #17.
