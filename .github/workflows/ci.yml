name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build all packages
        # Build must run before typecheck: @depress-org/core and
        # @depress-org/wp-migrate are consumed by sibling packages via their
        # compiled dist/*.d.ts (package.json "types" points at dist), which
        # only exist after `tsc` has run once. Typechecking first produces
        # spurious TS2307 "Cannot find module" errors on a fresh checkout.
        run: npm run build --workspaces --if-present

      - name: Type-check
        run: npm run typecheck --workspaces --if-present

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Run tests with coverage (best-effort)
        # Coverage config lands via qa task t_912a3e7a (vitest --coverage setup,
        # coverage baseline). Non-blocking until that config exists everywhere,
        # so this step must never fail the required CI job.
        continue-on-error: true
        run: npm run test --workspaces --if-present -- --coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
